[package]
name = "triggers"
version = "0.1.0"
edition = "2021"
description = "Minimal text expander for Wayland: type a trigger, get a snippet."
license = "MIT"

[dependencies]
anyhow = "1"
evdev = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.8"

[profile.release]
strip = true
lto = true
