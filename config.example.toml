# triggers config: copy to ~/.config/triggers/config.toml
#
# Each entry has exactly two keys:
#   trigger = what you type (no spaces)
#   snippet = what replaces it (any text; use """ for multiple lines)
#
# Triggers starting with a letter/digit only fire at the start of a word,
# so "rg" won't fire inside "forget". Triggers starting with punctuation
# (e.g. ";sig") fire anywhere.
#
# Reload after editing: systemctl --user reload triggers

[[snippets]]
trigger = "rg"
snippet = "ripgrep"

[[snippets]]
trigger = ";sig"
snippet = """
Best,
Joe"""

# {{clipboard}} is replaced by the latest clipboard text when the trigger fires.
# (A literal "{{" is written "{{{{".) In a literal string ('...'), \n and \n\n
# type a newline and a blank line; \\ types a backslash.
[[snippets]]
trigger = "Thanks for your order!"
snippet = """
Hi,

Your order #{{clipboard}} was successfully placed.

Thanks"""
